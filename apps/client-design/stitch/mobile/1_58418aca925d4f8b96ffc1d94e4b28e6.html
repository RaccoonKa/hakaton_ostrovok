<div class="flex flex-col items-center text-center pt-space-2xl pb-space-lg max-w-xl mx-auto w-full">
<div class="w-12 h-12 rounded-2xl bg-surface-container flex items-center justify-center text-primary mb-space-lg shadow-sm">
<span class="material-symbols-outlined text-[26px]">travel_explore</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary tracking-tight font-semibold mb-space-sm">
      Куда хотите поехать?
    </h1>
<p class="font-body-md text-body-md text-text-secondary max-w-md mx-auto leading-relaxed">Напишите своими словами: даты, бюджет, пожелания — ассистент подберёт направления, отели и маршрут.</p>
<div class="w-full flex flex-col gap-space-sm mt-space-xl text-left">
<button class="prompt-chip group flex items-center gap-space-md p-space-md rounded-xl bg-canvas-muted hover:bg-surface-container-high transition-all text-text-primary active:scale-[0.99]" data-prompt="Тёплое море в ноябре с ребёнком до 200 000 ₽" type="button">
<div class="w-8 h-8 rounded-lg bg-surface-container-lowest flex items-center justify-center text-text-primary shadow-sm shrink-0">
<span class="material-symbols-outlined text-[18px]">beach_access</span>
</div>
<span class="font-body-sm text-body-sm text-text-primary font-medium flex-1 truncate">Тёплое море в ноябре с ребёнком до 200&nbsp;000&nbsp;₽</span>
<span class="material-symbols-outlined text-[18px] text-text-tertiary group-hover:text-primary transition-colors">north_east</span>
</button>
<button class="prompt-chip group flex items-center gap-space-md p-space-md rounded-xl bg-canvas-muted hover:bg-surface-container-high transition-all text-text-primary active:scale-[0.99]" data-prompt="Горные лыжи в Сочи на двоих в январе" type="button">
<div class="w-8 h-8 rounded-lg bg-surface-container-lowest flex items-center justify-center text-text-primary shadow-sm shrink-0">
<span class="material-symbols-outlined text-[18px]">downhill_skiing</span>
</div>
<span class="font-body-sm text-body-sm text-text-primary font-medium flex-1 truncate">Горные лыжи в Сочи на двоих в январе</span>
<span class="material-symbols-outlined text-[18px] text-text-tertiary group-hover:text-primary transition-colors">north_east</span>
</button>
<button class="prompt-chip group flex items-center gap-space-md p-space-md rounded-xl bg-canvas-muted hover:bg-surface-container-high transition-all text-text-primary active:scale-[0.99]" data-prompt="Выходные в Стамбуле: уютный бутик-отель" type="button">
<div class="w-8 h-8 rounded-lg bg-surface-container-lowest flex items-center justify-center text-text-primary shadow-sm shrink-0">
<span class="material-symbols-outlined text-[18px]">apartment</span>
</div>
<span class="font-body-sm text-body-sm text-text-primary font-medium flex-1 truncate">Выходные в Стамбуле: уютный бутик-отель</span>
<span class="material-symbols-outlined text-[18px] text-text-tertiary group-hover:text-primary transition-colors">north_east</span>
</button>
</div>
<div class="mt-space-lg">
<a class="inline-flex items-center gap-space-xs px-space-md py-space-xs rounded-full text-text-secondary hover:text-text-primary hover:bg-canvas-muted font-label-md text-label-md transition-colors" data-path="chat-history" href="#">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="">История диалогов</span>
</a>
</div>
</div>
<div class="w-full max-w-xl mx-auto mt-space-md">
<div class="bg-surface-container-lowest rounded-2xl p-space-sm shadow-md transition-shadow focus-within:shadow-lg">
<div class="relative w-full">
<textarea class="w-full bg-transparent resize-none p-space-sm font-body-md text-body-md text-text-primary placeholder:text-text-tertiary focus:outline-none" id="travel-composer" placeholder="Например: Хочу к тёплому морю в ноябре с ребёнком..." rows="3"></textarea>
</div>
<div class="flex items-center justify-between px-space-xs pt-space-xs">
<div class="flex items-center gap-space-2xs text-text-tertiary">
<button aria-label="Голосовой ввод" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-surface-container hover:text-primary transition-colors text-primary" id="mic-trigger" type="button">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<button aria-label="Прикрепить заметку или пожелание" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-canvas-muted hover:text-text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<div class="flex items-center gap-space-sm">
<span class="font-label-sm text-label-sm text-text-tertiary hidden select-none" id="char-hint">Enter для отправки</span>
<button aria-label="Отправить запрос" class="w-9 h-9 rounded-xl bg-canvas-muted text-text-tertiary flex items-center justify-center transition-all cursor-not-allowed" disabled="" id="send-trigger" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_upward</span>
</button>
</div>
</div>
</div>
<div class="flex items-center justify-center gap-space-xs mt-space-md text-text-tertiary">
<span class="material-symbols-outlined text-[14px]">bolt</span>
<span class="font-label-sm text-label-sm">Синтез билетов, жилья и трансферов за один шаг</span>
</div>
</div>
</div>
<script>
  (() => {
    const textarea = document.getElementById('travel-composer');
    const sendBtn = document.getElementById('send-trigger');
    const charHint = document.getElementById('char-hint');
    const micBtn = document.getElementById('mic-trigger');
    const chips = document.querySelectorAll('.prompt-chip');

    const updateState = () => {
      const value = textarea.value.trim();
      if (value.length > 0) {
        sendBtn.removeAttribute('disabled');
        sendBtn.className = 'w-9 h-9 rounded-xl bg-primary-container text-on-primary flex items-center justify-center transition-all shadow-sm hover:opacity-95 active:scale-95 cursor-pointer';
        charHint.classList.remove('hidden');
      } else {
        sendBtn.setAttribute('disabled', 'true');
        sendBtn.className = 'w-9 h-9 rounded-xl bg-canvas-muted text-text-tertiary flex items-center justify-center transition-all cursor-not-allowed';
        charHint.classList.add('hidden');
      }
    };

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
      updateState();
    });

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const text = chip.getAttribute('data-prompt') || '';
        textarea.value = text;
        textarea.focus();
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        updateState();
      });
    });

    micBtn.addEventListener('click', () => {
      micBtn.classList.toggle('text-error');
      micBtn.classList.toggle('bg-error-container');
    });

    sendBtn.addEventListener('click', () => {
      if (textarea.value.trim()) {
        const current = textarea.value.trim();
        textarea.value = '';
        updateState();
      }
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (textarea.value.trim()) {
          sendBtn.click();
        }
      }
    });
  })();
</script></main>

</body></html>
