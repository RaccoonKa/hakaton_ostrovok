[project]
name = "agent-service-toolkit"
version = "0.1.0"
description = "AI travel planner agent service built with LangGraph and FastAPI for Ostrovok Hackathon 2026"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.12,<3.15"

dependencies = [
    "ag-ui-langgraph~=0.0.42",
    "aiosqlite >=0.22.1",
    "bcrypt>=4.0.0",
    "certifi>=2026.10.19",
    "fastapi ~=0.141.0",
    "httpx ~=0.28.1",
    "langchain ~=1.3.11",
    "langchain-community ~=0.4.2",
    "langchain-core ~=1.4.8",
    "langchain-gigachat>=0.3.0",
    "langfuse ~=4.12",
    "langgraph ~=1.2.7",
    "langgraph-checkpoint-postgres~=3.1.1",
    "langgraph-checkpoint-sqlite~=3.1.0",
    "langsmith ~=0.11.0",
    "psycopg[binary,pool] ~=3.3.4",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.15.0",
    "pyjwt>=2.8.0",
    "python-dotenv ~=1.2.2",
    "setuptools ~=84.0.0",
    "uvicorn ~=0.52.0",
]

# Supply-chain cooldown: resolution only considers releases >=14 days old. Needs the
# repo's pinned uv version (older uv ignores this and strips it from uv.lock on re-lock).
# Policy and override procedure: .claude/skills/dependency-refresh/SKILL.md
[tool.uv]
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
certifi = "0 days"  # emSign CA removal (eMudhra incident); remove once >14 days old

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff ~=0.15.21",
    "pyrefly ~=1.1.1",
    "pymarkdownlnt",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "U"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
GIGACHAT_CREDENTIALS = "fake-gigachat-credentials"

[tool.pymarkdown]
# Docs use long, unwrapped prose lines rather than hard-wrapping at a fixed
# column, so line length isn't enforced.
plugins.md013.enabled = false
# Inline HTML (e.g. <img> with width=) is used intentionally in README.md.
plugins.md033.enabled = false
# Not every doc needs to start with a top-level heading.
plugins.md041.enabled = false
# Allow repeated heading text as long as it's not adjacent siblings.
plugins.md024.siblings_only = true

[tool.pyrefly]
project-includes = ["src"]
preset = "default"

[tool.pyrefly.errors]
# LangGraph's StateGraph(state_schema) generic bound rejects MessagesState
# subclasses, so this fires on every agent's StateGraph(AgentState). It's a gap
# in LangGraph's typing, not a real error, so disable it project-wide.
bad-specialization = false
